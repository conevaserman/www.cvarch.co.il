<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>האתר בשיפוץ | נשוב בקרוב</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #2c3e50;
        }
        .card {
            background: white;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 90%;
        }
        .icon {
            font-size: 56px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 0 15px 0;
            font-size: 28px;
            color: #1a252f;
        }
        p {
            margin: 0 0 25px 0;
            font-size: 17px;
            line-height: 1.6;
            color: #555;
        }
        .contact {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .contact:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🛠️</div>
        <h1>האתר שלנו בשיפוץ</h1>
        <p>אנחנו עובדים בימים אלו על אתר חדש ומשודרג.<br>נשוב לאוויר ממש בקרוב!</p>
        <!-- אפשר לשנות כאן את כתובת המייל או להסיר את השורה הבאה -->
        <a href="mailto:office@cvarch.co.il" class="contact">ליצירת קשר במייל</a>
    </div>
</body>
</html>
