<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cone Vaserman Architects | מתחדשים. משתדרגים. מדייקים.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 680px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 100%;
            max-width: 520px;
            height: auto;
            margin-bottom: 56px;
            display: block;
        }

        h1 {
            font-size: clamp(1.5rem, 3.2vw, 2.15rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            line-height: 1.4;
            margin-bottom: 22px;
            color: #000000;
        }

        .subtitle {
            font-size: clamp(1rem, 1.8vw, 1.15rem);
            font-weight: 300;
            line-height: 1.75;
            color: #444444;
            max-width: 480px;
            margin-bottom: 44px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background-color: #d4d4d4;
            margin-bottom: 36px;
        }

        .status {
            font-size: 1.05rem;
            font-weight: 400;
            color: #111111;
            margin-bottom: 8px;
        }

        .address {
            font-size: 0.95rem;
            font-weight: 300;
            color: #666666;
            letter-spacing: 0.02em;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #111111;
            font-size: 0.92rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            padding-bottom: 4px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.25s ease, opacity 0.25s ease;
        }

        .links a:hover {
            border-bottom-color: #111111;
            opacity: 0.7;
        }

        .links svg {
            width: 17px;
            height: 17px;
            stroke-width: 1.6;
        }

        @media (max-width: 480px) {
            .logo {
                max-width: 320px;
                margin-bottom: 42px;
            }
            .subtitle {
                margin-bottom: 34px;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <img src="logo.png" alt="Cone Vaserman Architects" class="logo">

        <h1>מתחדשים. משתדרגים. מדייקים.</h1>

        <p class="subtitle">
            אנחנו עובדים על כמה שיפורים שיהפכו את החוויה שלכם כאן לטובה עוד יותר.
        </p>

        <div class="divider"></div>

        <p class="status">ממשיכים כרגיל:)</p>
        <p class="address">תעשיה 9, ת״א</p>

        <nav class="links" aria-label="יצירת קשר ורשתות חברתיות">
            <a href="https://www.instagram.com/cone_vaserman_architects/" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
                <span>Instagram</span>
            </a>

            <a href="mailto:office@cvarch.co.il">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
                <span>office@cvarch.co.il</span>
            </a>
        </nav>
    </main>

</body>
</html>
